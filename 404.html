<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Page not found | Botswana Theory Test Prep</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0a4b9e">
<link rel="icon" href="/Driving/icons/favicon.svg" type="image/svg+xml">
<style>
@font-face{font-family:"Barlow Condensed";font-weight:700;font-display:swap;src:url("/Driving/fonts/barlow-condensed-700.woff2") format("woff2")}
@font-face{font-family:"Barlow";font-weight:400;font-display:swap;src:url("/Driving/fonts/barlow-400.woff2") format("woff2")}
:root{--bg:#edf0f3;--surface:#fff;--ink:#13181d;--muted:#56616c;--line:#cdd5dc;--sign:#0a4b9e;--sign-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#0f1317;--surface:#171d23;--ink:#edf1f4;--muted:#9aa6b1;--line:#2c353e;--sign:#5b9bf0;--sign-ink:#08121f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--ink);font:16px/1.5 "Barlow",system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
main{max-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:28px 22px;text-align:center}
.sign{display:inline-grid;place-items:center;width:64px;height:64px;background:var(--sign);color:var(--sign-ink);font:700 1.5rem "Barlow Condensed",Arial,sans-serif;border-radius:8px}
h1{font:700 2.2rem/1.1 "Barlow Condensed","Arial Narrow",Arial,sans-serif;text-transform:uppercase;margin:16px 0 8px}
p{margin:0 0 20px;color:var(--muted)}
a{display:inline-block;background:var(--sign);color:var(--sign-ink);border-radius:8px;padding:12px 18px;font-weight:600;text-decoration:none}
a:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
</style>
</head>
<body>
<main>
  <div class="sign" aria-hidden="true">404</div>
  <h1>Wrong turn</h1>
  <p>That page does not exist. The lessons, signs and practice questions are all back on the main road.</p>
  <a href="/Driving/">Go to the home page</a>
</main>
</body>
</html>
